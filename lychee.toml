# Never resolve private network, payment or local-development links.
# GitHub's unauthenticated API and DOI redirects return 403 from hosted CI.
exclude = ['(?i)\.onion(?:[:/]|$)', '(?i)\.i2p(?:[:/]|$)', '^monero:', '^feed:', '^https?://(?:localhost|127\.0\.0\.1)(?:[:/]|$)', '^https?://[^/]+/donate/', '^https?://api\.github\.com/repos/', '^https?://doi\.org/']
max_retries = 2
timeout = 20
