name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-evidence.ts record deadcode:check
      - run: bun scripts/build-evidence.ts record format:check
      - run: bun scripts/build-evidence.ts record lint
      - run: bun scripts/build-evidence.ts record type-coverage:check
      - run: bun scripts/build-evidence.ts record architecture:check
      - run: bun scripts/build-evidence.ts record check
      - run: bun scripts/build-evidence.ts record build
      - name: Install QR verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin zbar-tools
      - run: bun scripts/build-evidence.ts record test
        env:
          TEST_CHECKOUT: '1'
          TEST_DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      - name: Finalize build evidence
        if: always()
        run: bun run evidence:build
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-evidence
          path: public/build-evidence.json
          retention-days: 30
